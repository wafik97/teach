<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>الاستدعاء الذاتي في C# — دورة تفاعلية للصف الحادي عشر</title>
<meta name="description" content="دورة تفاعلية تعمل دون اتصال تعلّم الاستدعاء الذاتي في C# عبر مكدّس الاستدعاء المتحرك والأمثلة الموجّهة والتمارين ووضع عرض للمعلم." />
<style>
:root{
  --bg:#f5f8fd; --panel:#ffffff; --ink:#0d1730; --muted:#5a6580; --line:#e3eaf5;
  --navy:#0a1224;
  --blue:#2563eb; --cyan:#06b6d4; --violet:#7c3aed;
  --green:#10b981; --amber:#f59e0b; --red:#e11d48;
  --r:16px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --sh:0 1px 2px rgba(13,23,48,.05),0 14px 34px -20px rgba(13,23,48,.28);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);font-size:15.5px;line-height:1.75;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 520px at 15% -12%,#e6f0ff 0%,transparent 62%),radial-gradient(820px 460px at 110% 0%,#eaf6ff 0%,transparent 58%),var(--bg);}
h1,h2,h3,h4{margin:0 0 .45em;line-height:1.35;letter-spacing:0}
h2{font-size:clamp(23px,2.6vw,32px);font-weight:800}
h3{font-size:17.5px;font-weight:750}
p{margin:0 0 .85em}
ul,ol{margin:0 0 .85em;padding-right:1.15em;padding-left:0}
li{margin:.25em 0}
a{color:var(--blue);text-underline-offset:2px}
code{font-family:var(--mono);font-size:.93em;direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font:inherit}
::selection{background:#c7ddff}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:#fff;border-left:1px solid var(--line);padding:20px 16px 34px;z-index:40}
.side-brand{display:flex;align-items:center;gap:11px;padding:2px 6px 16px}
.side-brand .mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(140deg,var(--blue),var(--violet));box-shadow:0 10px 20px -12px rgba(37,99,235,.95);flex:none}
.side-brand h1{font-size:15px;margin:0;font-weight:800}
.side-brand p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
.side-prog{background:#f7faff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:18px}
.sp-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);font-weight:600}
.sp-row b{color:var(--ink);font-size:13px}
.sp-note{font-size:11px;color:var(--muted);margin-top:6px}
.pbar{height:8px;border-radius:99px;background:#e6eefb;overflow:hidden;margin-top:7px}
.pbar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(270deg,var(--blue),var(--cyan) 55%,var(--violet));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:10.5px;letter-spacing:.06em;color:#8a95ad;font-weight:700;margin:16px 8px 6px}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;text-decoration:none;color:#33405c;font-size:13.2px;font-weight:550;transition:background .16s,color .16s}
.nav a:hover{background:#f2f6fd}
.nav a.active{background:linear-gradient(270deg,#eaf1ff,#f3f7ff);color:#12306b;font-weight:700;box-shadow:inset -2px 0 0 var(--blue)}
.nav a .tick{width:15px;height:15px;flex:none;color:#c3cde0}
.nav a.done .tick{color:var(--green)}
.nav a.active .tick{color:var(--blue)}
.nav a.done.active .tick{color:var(--green)}
.side-foot{font-size:11px;color:#93a0b8;margin-top:20px;padding:0 8px;line-height:1.6}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:35;display:flex;align-items:center;gap:14px;padding:11px clamp(14px,2.4vw,30px);
  background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand-mini{font-weight:800;font-size:14px;white-space:nowrap}
.brand-mini span{font-weight:500;color:var(--muted);font-size:12px;margin-right:7px}
.topbar .pbar{flex:1;max-width:420px;margin:0}
.topbar .pct{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:36px}
.spacer{flex:1}
.content{width:100%;max-width:1220px;margin:0 auto;padding:clamp(18px,2.6vw,32px) clamp(14px,2.4vw,32px) 90px}
.scrim{display:none;position:fixed;inset:0;background:rgba(10,18,36,.42);z-index:38;backdrop-filter:blur(2px)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:650;font-size:13.2px;padding:9px 14px;
  border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .16s ease;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#c6d4ea;transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(13,23,48,.5)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border-color:transparent;box-shadow:0 10px 22px -14px rgba(37,99,235,.95)}
.btn.cyan{background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;border-color:transparent}
.btn.soft{background:#eef4ff;border-color:#dbe6fb;color:#1c3d7a}
.btn.ghost{background:transparent;border-color:transparent;color:#4a5876}
.btn.ghost:hover:not(:disabled){background:#f1f5fc;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:#3d4b68;transition:.16s}
.icon-btn:hover{background:#f4f8ff}

/* ---------- views ---------- */
.view{animation:fadeUp .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view-head{margin-bottom:22px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:750;letter-spacing:.04em;color:#3f6bd4;margin-bottom:9px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 3px rgba(6,182,212,.18)}
.lede{color:#46536e;font-size:16px;max-width:70ch;margin-bottom:12px}
.meta-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.8px;font-weight:650;color:#3c4b68;background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:99px}

.layout{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.viz-col{position:sticky;top:74px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:19px 21px;box-shadow:var(--sh)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-top h3{margin:0}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));padding:3px 8px;border-radius:6px}
.concept h4{font-size:13.5px;margin:16px 0 6px;color:#2b3a5c}
.concept h4:first-child{margin-top:0}
.concept ul{color:#39465f}
.concept b,.concept strong{color:#12306b}
.kv{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin:8px 0}
.kv .lbl{font-size:11px;font-weight:800;letter-spacing:.03em;color:#8b96ad;min-width:70px}
.kv code{background:#f2f6fd;border:1px solid var(--line);padding:4px 9px;border-radius:8px;color:#12306b;font-weight:600}
.out-chip{font-family:var(--mono);font-weight:700;font-size:14px;color:#0b3b2e;background:#e9fbf3;border:1px solid #b7ebd4;padding:5px 11px;border-radius:8px;direction:ltr}
.out-chip.wide{white-space:pre-wrap}

/* ---------- code ---------- */
.code{background:var(--navy);border-radius:13px;padding:12px 0;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.8;color:#dce8ff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.045);direction:ltr;text-align:left}
.code.mini{font-size:12.5px}
.cl{display:grid;grid-template-columns:42px minmax(0,1fr);padding:0 14px 0 0;white-space:pre;transition:background .2s}
.cl .ln{text-align:right;padding-right:14px;color:#33415e;user-select:none;font-size:11.5px}
.cl.active{background:linear-gradient(90deg,rgba(37,99,235,.42),rgba(6,182,212,.14));box-shadow:inset 3px 0 0 var(--cyan)}
.cl.active .ln{color:#8fb8ff;font-weight:700}
.tok-kw{color:#c4b5fd}
.tok-type{color:#67e8f9}
.tok-fn{color:#93c5fd}
.tok-num{color:#fbbf24}
.tok-str{color:#86efac}
.tok-com{color:#64748b;font-style:italic}
.code-foot{display:flex;justify-content:space-between;font-size:11px;color:#8b96ad;margin-top:9px}

/* ---------- visualizer ---------- */
.viz{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:15px;display:flex;flex-direction:column;gap:11px}
.viz-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.viz-tag{font-size:10.5px;font-weight:800;color:#1d4ed8;background:#eaf1ff;border:1px solid #d9e6ff;padding:3px 9px;border-radius:99px}
.viz-count{font-size:11.5px;font-weight:700;color:#8b96ad;font-variant-numeric:tabular-nums}
.vz-input{background:#f7faff;border:1px solid var(--line);border-radius:11px;padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.vz-input .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.vz-input label{font-size:11.5px;font-weight:800;color:#6c7a95}
.vz-input input[type=number],.vz-input input[type=text]{font-family:var(--mono);font-size:13px;padding:6px 9px;border-radius:8px;border:1px solid #d5e0f1;background:#fff;color:#12203c;width:104px;direction:ltr;text-align:left}
.vz-input input[type=text]{width:100%;flex:1;min-width:150px}
.vz-input input[type=range]{flex:1;min-width:110px;accent-color:var(--blue);direction:ltr}
.vz-input .err{font-size:11.5px;color:var(--red);font-weight:600}
.vz-input .hint{font-size:11px;color:#8b96ad}
.vz-main{display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:11px}
.vz-main .code{max-height:250px}
.panel-label{font-size:10px;font-weight:800;letter-spacing:.03em;color:#8b96ad;margin-bottom:6px;display:block}
.stack{display:flex;flex-direction:column;gap:7px;max-height:250px;overflow-y:auto;padding-left:3px}
.frame{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff;animation:pop .26s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateX(-10px) scale(.96)}to{opacity:1;transform:none}}
.frame-top{display:flex;align-items:center;justify-content:space-between;gap:5px}
.frame-top code{font-size:11.5px;font-weight:700;color:#12203c}
.frame-args{font-size:10.5px;color:#64718c;font-family:var(--mono);margin-top:2px;direction:ltr;text-align:left}
.frame-pend{font-size:10.5px;color:#a1640a;margin-top:3px;font-family:var(--mono);direction:ltr;text-align:left}
.frame-ret{font-size:10.5px;color:#067a55;margin-top:3px;font-family:var(--mono);font-weight:700;direction:ltr;text-align:left}
.badge{font-size:8.5px;font-weight:800;padding:2px 5px;border-radius:5px;white-space:nowrap}
.b-call{background:#dbeafe;color:#1d4ed8}
.b-wait{background:#fef3c7;color:#a16207}
.b-base{background:#ede9fe;color:#6d28d9}
.b-ret{background:#d1fae5;color:#047857}
.b-done{background:#e2e8f0;color:#475569}
.frame.s-CALL{border-color:#bfdbfe;background:#f6faff}
.frame.s-WAITING{border-color:#fde68a;background:#fffdf5}
.frame.s-BASE{border-color:#ddd6fe;background:#faf8ff;box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.frame.s-RETURN{border-color:#a7f3d0;background:#f5fefb}
.cells{display:flex;gap:6px;flex-wrap:wrap;direction:ltr}
.cell{min-width:44px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:center;overflow:hidden;transition:all .22s}
.cell .ci{font-size:9.5px;color:#93a0b8;background:#f5f8fd;padding:1px 0;font-family:var(--mono)}
.cell .cv{font-family:var(--mono);font-weight:700;font-size:14px;padding:5px 7px}
.cell.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.16);transform:translateY(-2px);background:#f7faff}
.cell.match{border-color:var(--green);background:#ecfdf5;box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.cell.dim{opacity:.5}
.note-box{background:linear-gradient(135deg,#0f1a31,#132444);border-radius:12px;padding:10px 13px;color:#dbe7ff;min-height:58px;display:flex;flex-direction:column;justify-content:center}
.note-box .panel-label{color:#7b90bb;margin-bottom:2px}
.note-box p{margin:0;font-size:12.8px;line-height:1.6}
.vz-lower{display:grid;grid-template-columns:1fr 118px;gap:9px}
.out-box,.res-box{background:#f7faff;border:1px solid var(--line);border-radius:11px;padding:8px 11px;min-height:56px}
.out-box pre{margin:0;font-family:var(--mono);font-size:13px;color:#0b3b2e;white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left}
.res-box .val{font-family:var(--mono);font-size:18px;font-weight:800;color:#12306b}
.vz-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.vz-scrub{flex:1;min-width:80px;accent-color:var(--violet);direction:ltr}
.speed{font-size:11.5px;font-weight:650;border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff;color:#3d4b68}

/* ---------- exercises ---------- */
.exs{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.exs-head{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;color:#6c7a95}
.ex{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--sh)}
.ex-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.ex-kind{font-size:10px;font-weight:800;color:#8b96ad}
.ex-num{font-size:10.5px;font-weight:800;color:#b6c0d3}
.ex-q{margin:0 0 11px;font-weight:600;font-size:14.6px;color:#16244a}
.opts{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:10px;text-align:right;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:13.6px;color:#2a3752;transition:.15s;font-family:var(--sans)}
.opt:hover{border-color:#bcd0ee;background:#f8fbff}
.opt .key{width:21px;height:21px;flex:none;border-radius:6px;border:1px solid #d5e0f1;display:grid;place-items:center;font-size:11px;font-weight:800;color:#7b87a0;font-family:var(--mono)}
.opt.sel{border-color:var(--blue);background:#eff5ff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.opt.sel .key{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.correct{border-color:var(--green);background:#effcf6}
.opt.correct .key{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:#fda4af;background:#fff1f3}
.opt.wrong .key{background:var(--red);border-color:var(--red);color:#fff}
.opt:disabled{cursor:default}
.ans-input{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ans-input input{flex:1;min-width:150px;font-family:var(--mono);font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid #d5e0f1;background:#fff;color:#12203c;direction:ltr;text-align:left}
.ans-input input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.ex-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.fb{margin-top:11px;padding:11px 13px;border-radius:11px;font-size:13.4px;display:none;line-height:1.65}
.fb.show{display:block;animation:fadeUp .25s both}
.fb.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.fb.no{background:#fff1f3;border:1px solid #fecdd3;color:#9f1239}
.fb.note{background:#f5f8fd;border:1px solid var(--line);color:#3d4b68}
.fb.hint{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.fb.sol{background:#f6f4ff;border:1px solid #ddd6fe;color:#4c1d95}
.fb b{font-weight:800}
.fb pre{margin:7px 0 0;font-family:var(--mono);font-size:12.4px;background:rgba(10,18,36,.06);padding:8px 10px;border-radius:8px;overflow:auto;color:#1e293b;direction:ltr;text-align:left}

/* ---------- intro ---------- */
.hero{background:linear-gradient(135deg,#0b1428 0%,#101d3a 55%,#152046 100%);border-radius:22px;padding:clamp(22px,3.2vw,42px);color:#fff;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:26px;align-items:center;box-shadow:0 30px 70px -40px rgba(10,20,44,.9);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:420px;height:420px;left:-140px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.45),transparent 65%);filter:blur(6px)}
.hero h2{font-size:clamp(27px,4vw,44px);color:#fff;margin-bottom:.35em;line-height:1.15}
.hero .lede{color:#b9c8e6;font-size:16.5px}
.hero .eyebrow{color:#7dd3fc}
.hero .eyebrow .dot{background:#22d3ee}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.hero .btn.soft{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#e6efff}
.hero-stats{list-style:none;padding:0;display:flex;gap:20px;margin:20px 0 0;flex-wrap:wrap}
.hero-stats li{font-size:12px;color:#9fb2d6}
.hero-stats b{display:block;font-size:20px;color:#fff;font-weight:800}
.hero-art{position:relative;z-index:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:16px;margin-top:18px}
.lesson-card{display:flex;flex-direction:column;gap:6px}
.lesson-card .num{font-size:11px;font-weight:800;color:var(--violet)}
.sched{list-style:none;padding:0;margin:8px 0 0;font-size:12.8px;color:#4a5876}
.sched li{display:flex;gap:9px;padding:5px 0;border-bottom:1px dashed #eaeff8}
.sched li:last-child{border:0}
.sched b{color:#12306b;font-family:var(--mono);font-size:11.5px;min-width:56px;padding-top:1px;direction:ltr}
.list-check{list-style:none;padding:0;margin:0}
.list-check li{display:flex;gap:9px;align-items:flex-start;font-size:13.6px;color:#39465f;margin:7px 0}
.tick-ico{width:17px;height:17px;flex:none;color:var(--green);margin-top:5px}

/* ---------- teacher ---------- */
details.teacher{background:#fbfcff;border:1px dashed #cdd9ec;border-radius:13px;padding:0;overflow:hidden}
details.teacher>summary{cursor:pointer;padding:11px 16px;font-size:12.5px;font-weight:750;color:#41527a;list-style:none;display:flex;align-items:center;gap:8px}
details.teacher>summary::-webkit-details-marker{display:none}
details.teacher>summary::before{content:"◂";color:var(--violet);font-size:12px;transition:transform .2s}
details.teacher[open]>summary::before{transform:rotate(-90deg)}
.t-body{padding:0 16px 14px;font-size:13px;color:#43506b;border-top:1px solid #e8eefa}
.t-row{margin-top:10px}
.t-row b{display:block;font-size:10.5px;color:#8b96ad;margin-bottom:2px}

/* ---------- pager + quiz ---------- */
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.quiz-wrap{display:flex;flex-direction:column;gap:13px;margin-top:6px}
.q{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:var(--sh)}
.q-head{display:flex;gap:9px;align-items:baseline;margin-bottom:8px}
.q-num{font-size:10.5px;font-weight:800;color:#b6c0d3;font-family:var(--mono)}
.q-topic{font-size:10px;font-weight:800;color:#8b96ad;margin-right:auto}
.q-text{font-weight:600;font-size:14.4px;margin:0 0 10px;color:#16244a}
.q.review-ok{border-color:#a7f3d0}
.q.review-no{border-color:#fecdd3}
.q-explain{margin-top:9px;font-size:12.8px;color:#4a5876;background:#f8fafd;border-right:3px solid #cbd5e1;padding:7px 11px;border-radius:8px 0 0 8px}
.score-card{background:linear-gradient(135deg,#0b1428,#14224a);color:#fff;border-radius:18px;padding:24px;text-align:center;box-shadow:0 26px 60px -38px rgba(10,20,44,.95)}
.score-card .big{font-size:46px;font-weight:800;line-height:1;direction:ltr}
.score-card p{color:#b9c8e6;margin:6px 0 0;font-size:13.5px}
.reco{display:flex;flex-direction:column;gap:8px;margin-top:14px;text-align:right}
.reco-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:11px;padding:10px 13px;font-size:13px}

/* ---------- presentation ---------- */
.present-bar{display:none;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:70;gap:6px;align-items:center;
  background:rgba(10,18,36,.94);backdrop-filter:blur(10px);padding:8px 10px;border-radius:14px;box-shadow:0 24px 50px -20px rgba(10,18,36,.9);flex-wrap:wrap;max-width:96vw}
.present-bar .btn{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.16);color:#e8f0ff;font-size:12.5px;padding:7px 11px}
.present-bar .btn:hover{background:rgba(255,255,255,.18);box-shadow:none}
.present-bar .sep{width:1px;height:22px;background:rgba(255,255,255,.16);margin:0 3px}
body.present .sidebar{display:none}
body.present .app{grid-template-columns:1fr}
body.present{font-size:17px}
body.present .content{max-width:1500px}
body.present .present-bar{display:flex}
body.present .topbar{padding-top:8px;padding-bottom:8px}
body.present h2{font-size:clamp(28px,3.4vw,42px)}
body.present .lede{font-size:18.5px}
body.present .concept,.ex-q{font-size:16.5px}
body.present .code{font-size:15px;line-height:1.9}
body.present .viz{padding:19px}
body.present .frame-top code{font-size:13px}
body.present .note-box p{font-size:15px}
body.present .opts .opt{font-size:15px;padding:11px 14px}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .viz-col{position:static}
  .hero{grid-template-columns:1fr}
  .hero-art{display:none}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;right:0;top:0;width:290px;transform:translateX(104%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 60px rgba(10,18,36,.24)}
  .sidebar.open{transform:none}
  .scrim.show{display:block}
  .brand-mini span{display:none}
  #presentBtn span{display:none}
}
@media (max-width:640px){
  .vz-main{grid-template-columns:1fr}
  .code{font-size:12px}
  .topbar{gap:9px}
  .topbar .pct{display:none}
  .pager{flex-direction:column-reverse}
  .pager .btn{width:100%}
  .vz-lower{grid-template-columns:1fr}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media print{.sidebar,.topbar,.present-bar,.vz-controls,.btn{display:none!important}}

<script>
"use strict";
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

var CS_KW = { "static": 1, "void": 1, "int": 1, "bool": 1, "return": 1, "if": 1, "else": 1, "new": 1, "string": 1, "true": 1, "false": 1, "null": 1, "class": 1, "public": 1, "for": 1, "while": 1, "foreach": 1, "in": 1, "var": 1 };
var TOK = /(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|(\b\d+\b)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|([^\sA-Za-z0-9_])/g;
function highlight(code) {
  var out = "", m;
  TOK.lastIndex = 0;
  while ((m = TOK.exec(code)) !== null) {
    if (m[1]) out += '<span class="tok-com">' + esc(m[1]) + "</span>";
    else if (m[2]) out += '<span class="tok-str">' + esc(m[2]) + "</span>";
    else if (m[3]) out += '<span class="tok-num">' + esc(m[3]) + "</span>";
    else if (m[4]) {
      var w = m[4];
      if (CS_KW[w]) out += '<span class="tok-kw">' + w + "</span>";
      else if (/^[A-Z]/.test(w)) out += '<span class="tok-fn">' + w + "</span>";
      else out += esc(w);
    } else out += esc(m[5] || m[6]);
  }
  return out;
}
function codePanel(codeLines) {
  return codeLines.map(function (l, i) {
    return '<div class="cl" data-i="' + i + '"><span class="ln">' + (i + 1) + '</span><span class="lc">' + (highlight(l) || "&nbsp;") + "</span></div>";
  }).join("");
}

/* ---------------- C# source used by the lessons ---------------- */
var CODE = {
  printBefore: "static void Print(int n)\n{\n    if (n == 0)\n        return;\n\n    Console.Write(n + \" \");\n    Print(n - 1);\n}",
  printAfter: "static void Print(int n)\n{\n    if (n == 0)\n        return;\n\n    Print(n - 1);\n    Console.Write(n + \" \");\n}",
  sum: "static int Sum(int n)\n{\n    if (n == 0)\n        return 0;\n\n    return n + Sum(n - 1);\n}",
  digitSum: "static int DigitSum(int n)\n{\n    if (n == 0)\n        return 0;\n\n    return n % 10 + DigitSum(n / 10);\n}",
  digits: "static int Digits(int n)\n{\n    if (n < 10)\n        return 1;\n\n    return 1 + Digits(n / 10);\n}",
  maximum: "static int Maximum(int[] a, int index)\n{\n    if (index == a.Length - 1)\n        return a[index];\n\n    int maxRest = Maximum(a, index + 1);\n\n    if (a[index] > maxRest)\n        return a[index];\n\n    return maxRest;\n}",
  minimum: "static int Minimum(int[] a, int index)\n{\n    if (index == a.Length - 1)\n        return a[index];\n\n    int minRest = Minimum(a, index + 1);\n\n    if (a[index] < minRest)\n        return a[index];\n\n    return minRest;\n}",
  countEven: "static int CountEven(int[] a, int index)\n{\n    if (index == a.Length)\n        return 0;\n\n    int count = CountEven(a, index + 1);\n\n    if (a[index] % 2 == 0)\n        return count + 1;\n\n    return count;\n}",
  contains: "static bool Contains(int[] a, int index, int x)\n{\n    if (index == a.Length)\n        return false;\n\n    if (a[index] == x)\n        return true;\n\n    return Contains(a, index + 1, x);\n}"
};

/* ---------------- trace recorder ---------------- */
function makeRec() {
  return {
    frames: [], stack: [], uid: 0, out: "", result: null,
    snap: function (line, note, extra) {
      var f = {
        line: line, note: note, output: this.out, result: this.result,
        stack: this.stack.map(function (s) { return { id: s.id, label: s.label, args: s.args, state: s.state, pending: s.pending, ret: s.ret, line: s.line }; })
      };
      if (extra) for (var k in extra) f[k] = extra[k];
      this.frames.push(f);
    },
    push: function (label, args) {
      var f = { id: ++this.uid, label: label, args: args, state: "CALL", pending: "", ret: null };
      this.stack.push(f); return f;
    },
    pop: function () { this.stack.pop(); }
  };
}

var TRACES = {
  printBefore: function (inp) {
    var r = makeRec();
    (function call(n) {
      var f = r.push("Print(" + n + ")", { n: n });
      r.snap(1, "استدعاء Print(" + n + ") — يُضاف إطار جديد إلى أعلى مكدّس الاستدعاء.");
      f.state = "WAITING";
      r.snap(2, "تحقّق من الحالة الأساسية: هل n == 0؟   (n = " + n + ")");
      if (n === 0) {
        f.state = "BASE";
        r.snap(3, "وصلنا إلى الحالة الأساسية. تُرجع Print(0) فورًا دون طباعة أي شيء.");
        f.ret = "—"; f.state = "RETURN";
        r.snap(3, "تُرجع Print(0) إلى مُستدعيها.");
        r.pop(); return;
      }
      r.snap(5, "الشرط n == 0 غير محقّق، فنُطبع قبل الاستدعاء الذاتي: Console.Write(" + n + " + \" \")");
      r.out = r.out ? r.out + " " + n : String(n);
      r.snap(5, "المخرجات حتى الآن: «" + r.out + "»");
      f.pending = "Print(" + (n - 1) + ")"; f.state = "WAITING";
      r.snap(6, "استدعِ Print(" + (n - 1) + "). يتوقّف هذا الإطار عند السطر 6 حتى يعود الاستدعاء.");
      call(n - 1);
      f.pending = ""; f.state = "RETURN";
      r.snap(7, "تنتهي Print(" + n + ") ويعود التحكّم إلى مُستدعيها.");
      r.pop();
    })(inp.n);
    r.snap(-1, "انتهى التنفيذ. المكدّس فارغ والمخرجات هي: " + r.out);
    return r.frames;
  },

  printAfter: function (inp) {
    var r = makeRec();
    (function call(n) {
      var f = r.push("Print(" + n + ")", { n: n });
      r.snap(1, "استدعاء Print(" + n + ") — يُضاف إطار جديد إلى أعلى مكدّس الاستدعاء.");
      f.state = "WAITING";
      r.snap(2, "تحقّق من الحالة الأساسية: هل n == 0؟   (n = " + n + ")");
      if (n === 0) {
        f.state = "BASE";
        r.snap(3, "وصلنا إلى الحالة الأساسية. تُرجع Print(0) فورًا.");
        f.ret = "—"; f.state = "RETURN";
        r.snap(3, "تُرجع Print(0) إلى مُستدعيها — وما زال لا شيء مطبوعًا.");
        r.pop(); return;
      }
      f.pending = "Print(" + (n - 1) + ")"; f.state = "WAITING";
      r.snap(5, "استدعِ Print(" + (n - 1) + ") أولًا. لا تُطبع أي قيمة بعد — هذا الإطار في انتظار.");
      call(n - 1);
      f.pending = "";
      r.snap(6, "عاد الاستدعاء الأعمق. الآن اطبع " + n + " — وهذا يحدث بعد الاستدعاء.");
      r.out = r.out ? r.out + " " + n : String(n);
      r.snap(6, "المخرجات حتى الآن: «" + r.out + "»");
      f.state = "RETURN";
      r.snap(7, "تنتهي Print(" + n + ").");
      r.pop();
    })(inp.n);
    r.snap(-1, "انتهى التنفيذ. المخرجات هي: " + r.out);
    return r.frames;
  },

  sum: function (inp) {
    var r = makeRec();
    var final = (function call(n) {
      var f = r.push("Sum(" + n + ")", { n: n });
      r.snap(1, "استدعاء Sum(" + n + ")");
      f.state = "WAITING";
      r.snap(2, "هل n == 0؟   (n = " + n + ")");
      if (n === 0) {
        f.state = "BASE";
        r.snap(3, "الحالة الأساسية: تُرجع Sum(0) القيمة 0، ولا تُجرى استدعاءات أخرى.");
        f.ret = 0; f.state = "RETURN";
        r.snap(3, "تُرجع Sum(0) القيمة 0 إلى مُستدعيها.");
        r.pop(); return 0;
      }
      f.pending = n + " + Sum(" + (n - 1) + ")";
      r.snap(5, "Sum(" + n + ") = " + n + " + Sum(" + (n - 1) + ") ← يتوقّف الإطار في انتظار Sum(" + (n - 1) + ").");
      var got = call(n - 1);
      f.pending = "";
      f.ret = n + got; f.state = "RETURN";
      r.snap(5, "أعادت Sum(" + (n - 1) + ") القيمة " + got + ". إذن Sum(" + n + ") = " + n + " + " + got + " = " + (n + got) + ".");
      r.pop();
      return n + got;
    })(inp.n);
    r.result = final;
    r.snap(-1, "الإجابة: Sum(" + inp.n + ") = " + final + ".");
    return r.frames;
  },

  digitSum: function (inp) {
    var r = makeRec();
    var final = (function call(n) {
      var f = r.push("DigitSum(" + n + ")", { n: n });
      r.snap(1, "استدعاء DigitSum(" + n + ")");
      f.state = "WAITING";
      r.snap(2, "هل n == 0؟   (n = " + n + ")");
      if (n === 0) {
        f.state = "BASE";
        r.snap(3, "الحالة الأساسية: لم يتبقَّ أي رقم، لذا تُرجع DigitSum(0) القيمة 0.");
        f.ret = 0; f.state = "RETURN";
        r.snap(3, "تُرجع DigitSum(0) القيمة 0 إلى مُستدعيها.");
        r.pop(); return 0;
      }
      var last = n % 10, rest = Math.floor(n / 10);
      f.pending = last + " + DigitSum(" + rest + ")";
      r.snap(5, "n % 10 = " + last + " (الرقم الأخير)   و   n / 10 = " + rest + " (القسمة الصحيحة تحذفه).");
      r.snap(5, "DigitSum(" + n + ") = " + last + " + DigitSum(" + rest + ") ← انتظر العدد الأصغر.");
      var got = call(rest);
      f.pending = "";
      f.ret = last + got; f.state = "RETURN";
      r.snap(5, "أعادت DigitSum(" + rest + ") القيمة " + got + ". إذن DigitSum(" + n + ") = " + last + " + " + got + " = " + (last + got) + ".");
      r.pop();
      return last + got;
    })(inp.n);
    r.result = final;
    r.snap(-1, "الإجابة: مجموع أرقام العدد " + inp.n + " يساوي " + final + ".");
    return r.frames;
  },

  digits: function (inp) {
    var r = makeRec();
    var final = (function call(n) {
      var f = r.push("Digits(" + n + ")", { n: n });
      r.snap(1, "استدعاء Digits(" + n + ")");
      f.state = "WAITING";
      r.snap(2, "هل n < 10؟   (n = " + n + ")");
      if (n < 10) {
        f.state = "BASE";
        r.snap(3, "الحالة الأساسية: العدد " + n + " مكوّن من رقم واحد، لذا يُحتسب رقمًا واحدًا.");
        f.ret = 1; f.state = "RETURN";
        r.snap(3, "تُرجع Digits(" + n + ") القيمة 1.");
        r.pop(); return 1;
      }
      var rest = Math.floor(n / 10);
      f.pending = "1 + Digits(" + rest + ")";
      r.snap(5, "n / 10 = " + rest + " — القسمة الصحيحة تحذف رقمًا واحدًا. عُدّ الباقي ثم أضف 1.");
      var got = call(rest);
      f.pending = "";
      f.ret = 1 + got; f.state = "RETURN";
      r.snap(5, "أعادت Digits(" + rest + ") القيمة " + got + ". إذن Digits(" + n + ") = 1 + " + got + " = " + (1 + got) + ".");
      r.pop();
      return 1 + got;
    })(inp.n);
    r.result = final;
    r.snap(-1, "الإجابة: العدد " + inp.n + " يتكوّن من " + final + " رقماً.");
    return r.frames;
  }
};
Object.assign(TRACES, {
  maximum: function (inp) {
    var a = inp.arr.slice(), r = makeRec();
    function snapAt(line, note, active, extra) {
      var e = { arr: a.slice(), active: active };
      if (extra) for (var k in extra) e[k] = extra[k];
      r.snap(line, note, e);
    }
    var last = a.length - 1;
    var final = (function call(index) {
      var f = r.push("Maximum(a, " + index + ")", { index: index });
      snapAt(1, "استدعاء Maximum(a, " + index + ") — انظر إلى الفهرس " + index + ".", index);
      f.state = "WAITING";
      snapAt(2, "هل index == a.Length - 1؟   (" + index + " == " + last + ")", index);
      if (index === last) {
        f.state = "BASE";
        snapAt(3, "الحالة الأساسية: بقي عنصر واحد في هذا النطاق — a[" + index + "] = " + a[index] + " هو أكبر عنصر فيه.", index);
        f.ret = a[index]; f.state = "RETURN";
        snapAt(3, "تُرجع Maximum(a, " + index + ") القيمة " + a[index] + ".", index);
        r.pop(); return a[index];
      }
      f.pending = "Maximum(a, " + (index + 1) + ")";
      snapAt(5, "ابحث عن أكبر عنصر في البقية: Maximum(a, " + (index + 1) + "). هذا الإطار ينتظر.", index);
      var rest = call(index + 1);
      f.pending = "";
      var bigger = a[index] > rest;
      snapAt(7, "maxRest = " + rest + ". قارن a[" + index + "] = " + a[index] + " > " + rest + " → " + bigger + ".", index);
      f.ret = bigger ? a[index] : rest; f.state = "RETURN";
      snapAt(bigger ? 8 : 10, bigger ? a[index] + " أكبر → أرجع a[" + index + "] = " + a[index] + "." : a[index] + " ليس أكبر → أرجع maxRest = " + rest + ".", index);
      r.pop(); return bigger ? a[index] : rest;
    })(0);
    r.result = final;
    snapAt(-1, "انتهى. أكبر قيمة هي " + final + ".", -1);
    return r.frames;
  },

  minimum: function (inp) {
    var a = inp.arr.slice(), r = makeRec();
    function snapAt(line, note, active) { r.snap(line, note, { arr: a.slice(), active: active }); }
    var last = a.length - 1;
    var final = (function call(index) {
      var f = r.push("Minimum(a, " + index + ")", { index: index });
      snapAt(1, "استدعاء Minimum(a, " + index + ") — انظر إلى الفهرس " + index + ".", index);
      f.state = "WAITING";
      snapAt(2, "هل index == a.Length - 1؟   (" + index + " == " + last + ")", index);

      if (p && typeof p === "object") {

function norm(s) {
  return String(s).toLowerCase().replace(/\s+/g, " ").trim().replace(/^["'«»]|["'«»]$/g, "").replace(/[.،]$/, "");
}

function markSolved(id) {
  if (store.solved[id]) return;
  store.solved[id] = true; persist(); updateProgress();
}

function buildExercise(ex, i) {
  var el = document.createElement("div");
  el.className = "ex";
  var selected = null;
  var optionsHTML = ex.type === "mc"
    ? '<div class="opts">' + ex.options.map(function (o, j) {
        return '<button class="opt" type="button" data-i="' + j + '"><span class="key">' + LETTERS[j] + "</span><span>" + o + "</span></button>";
      }).join("") + "</div>"
    : '<div class="ans-input"><input type="text" autocomplete="off" placeholder="اكتب إجابتك…" aria-label="إجابتك"></div>';

  el.innerHTML =
    '<div class="ex-top"><span class="ex-kind">' + (ex.type === "mc" ? "اختيار من متعدد" : "إجابة قصيرة") + '</span><span class="ex-num">س' + (i + 1) + "</span></div>" +
    '<p class="ex-q">' + ex.q + "</p>" + optionsHTML +
    '<div class="ex-actions">' +
      '<button class="btn primary sm" type="button" data-a="submit">تحقّق من الإجابة</button>' +
      '<button class="btn ghost sm" type="button" data-a="retry" disabled>حاول مجددًا</button>' +
      '<button class="btn ghost sm" type="button" data-a="hint">تلميح</button>' +
      '<button class="btn ghost sm" type="button" data-a="solution">اعرض الحل</button>' +
    "</div>" +
    '<div class="fb"></div>';

  var fb = $(".fb", el);
  var submit = $('[data-a="submit"]', el);
  var retry = $('[data-a="retry"]', el);
  var input = $("input[type=text]", el);

  function say(kind, html) { fb.className = "fb show " + kind; fb.innerHTML = html; }

  if (ex.type === "mc") {
    $$(".opt", el).forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (el.dataset.done === "1") return;
        selected = Number(btn.dataset.i);
        $$(".opt", el).forEach(function (b) { b.classList.remove("sel"); });
        btn.classList.add("sel");
      });
    });
  }

  function lock() {
    el.dataset.done = "1"; submit.disabled = true; retry.disabled = false;
    $$(".opt", el).forEach(function (b) { b.disabled = true; });
    if (input) input.disabled = true;
  }

  function reset() {
    el.dataset.done = "0"; submit.disabled = false; retry.disabled = true;
    selected = null; fb.className = "fb"; fb.innerHTML = "";
    $$(".opt", el).forEach(function (b) { b.disabled = false; b.classList.remove("sel", "correct", "wrong"); });
    if (input) { input.disabled = false; input.value = ""; input.style.borderColor = ""; }
  }

  submit.addEventListener("click", function () {
    var ok = false;
    if (ex.type === "mc") {
      if (selected === null) { say("note", "اختر أحد الخيارات أولًا."); return; }
      ok = selected === ex.answer;
      $$(".opt", el).forEach(function (b, j) {
        if (j === ex.answer) b.classList.add("correct");
        else if (j === selected) b.classList.add("wrong");
      });
    } else {
      var v = norm(input.value);
      if (!v) { say("note", "اكتب إجابة أولًا."); return; }
      ok = ex.answers.some(function (a) { return norm(a) === v; });
      input.style.borderColor = ok ? "#10b981" : "#e11d48";
    }
    if (ok) { say("ok", "<b>صحيح.</b> " + ex.explain); markSolved(ex.id); }
    else { say("no", "<b>ليس تمامًا.</b> جرّب التلميح، أو تابع الحركة خطوة بخطوة، أو افتح الحل النموذجي."); }
    lock();
  });

  if (input) {
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit.click(); });
  }
  retry.addEventListener("click", reset);
  $('[data-a="hint"]', el).addEventListener("click", function () { say("hint", "<b>تلميح.</b> " + ex.hint); });
  $('[data-a="solution"]', el).addEventListener("click", function () {
    say("sol", "<b>الحل النموذجي.</b><pre>" + esc(ex.solution) + "</pre>");
  });

  if (store.solved[ex.id]) {
    say("ok", "<b>سبق حلّه.</b> " + ex.explain);
    if (ex.type === "mc") { $$(".opt", el).forEach(function (b, j) { b.classList.add(j === ex.answer ? "correct" : "wrong"); }); }
    if (input) { input.value = ex.answers[0]; input.style.borderColor = "#10b981"; }
    lock();
  }
  return el;
}

function mountExercises(host, sec) {
  if (!host) return;
  host.innerHTML = '<div class="exs-head">تحقّق من فهمك<span style="color:#c3cde0">·</span>' + sec.exercises.length + " أسئلة</div>";
  sec.exercises.forEach(function (ex, i) { host.appendChild(buildExercise(ex, i)); });
}
/* ============================================================
   The recursion visualizer
   ============================================================ */
function createViz(root, sec) {
  var lines = sec.code.split("\n");
  var cfg = sec.input;
  var st = {
    frames: [], i: 0, timer: null, playing: false, speed: 1,
    input: !cfg ? null : (cfg.kind === "number" ? { n: cfg.def } : { arr: cfg.def.slice(), x: cfg.target })
  };
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) st.speed = 1.5;

  root.innerHTML =
    '<div class="viz-head"><span class="viz-tag">تتبّع التنفيذ</span><span class="viz-count">خطوة 0 / 0</span></div>' +
    (cfg ? '<div class="vz-input"></div>' : "") +
    '<div class="vz-main"><div class="code vz-code">' + codePanel(lines) + "</div>" +
      '<div><span class="panel-label">مكدّس الاستدعاء</span><div class="vz-stack stack"></div></div></div>' +
    (cfg && cfg.kind === "array" ? '<div><span class="panel-label">المصفوفة · الفهرس أعلى والقيمة أسفل</span><div class="cells vz-cells"></div></div>' : "") +
    '<div class="note-box"><span class="panel-label">الخطوة</span><p class="vz-note">اضغط «تشغيل» للبدء.</p></div>' +
    '<div class="vz-lower"><div class="out-box"><span class="panel-label">المخرجات</span><pre class="vz-out">—</pre></div>' +
      '<div class="res-box"><span class="panel-label">النتيجة</span><span class="val vz-res">—</span></div></div>' +
    '<div class="vz-controls">' +
      '<button class="btn sm" type="button" data-a="reset" title="إعادة">↺</button>' +
      '<button class="btn sm" type="button" data-a="back" title="خطوة للخلف">◀</button>' +
      '<button class="btn primary sm" type="button" data-a="play">▶ تشغيل</button>' +
      '<button class="btn sm" type="button" data-a="fwd" title="خطوة للأمام">▶❙</button>' +
      '<input class="vz-scrub" type="range" min="0" max="0" value="0" aria-label="موضع التتبّع">' +
      '<select class="speed" aria-label="سرعة الحركة"><option value="0.5">0.5×</option><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option></select>' +
    "</div>";

  var codeEl = $(".vz-code", root), stackEl = $(".vz-stack", root), cellsEl = $(".vz-cells", root);
  var noteEl = $(".vz-note", root), outEl = $(".vz-out", root), resEl = $(".vz-res", root);
  var countEl = $(".viz-count", root), scrub = $(".vz-scrub", root);
  var playBtn = $('[data-a="play"]', root), backBtn = $('[data-a="back"]', root), fwdBtn = $('[data-a="fwd"]', root), resetBtn = $('[data-a="reset"]', root);
  var speedSel = $(".speed", root);
  if (speedSel) speedSel.value = String(st.speed);

  /* ---- input controls ---- */
  if (cfg) buildInput($(".vz-input", root), cfg);

  function buildInput(box, c) {
    var err;
    if (c.kind === "number") {
      box.innerHTML = '<div class="row"><label>' + c.label + " =</label>" +
        (c.max <= 20 ? '<input type="range" min="' + c.min + '" max="' + c.max + '" step="1" value="' + c.def + '" aria-label="' + c.label + '">' : "") +
        '<input type="number" min="' + c.min + '" max="' + c.max + '" step="1" value="' + c.def + '" aria-label="' + c.label + '">' +
        '<span class="hint">أعداد صحيحة ' + c.min + "–" + c.max + "</span></div>" +
        '<div class="err" role="status"></div>';
      var num = $("input[type=number]", box), rng = $("input[type=range]", box);
      err = $(".err", box);
      function setN(v, from) {
        var n = parseInt(v, 10);
        if (isNaN(n)) { err.textContent = "أدخل عددًا صحيحًا."; return; }
        if (n < c.min || n > c.max) { err.textContent = "أدخل عددًا صحيحًا بين " + c.min + " و" + c.max + "."; return; }
        err.textContent = "";
        st.input.n = n;
        if (from !== "num") num.value = n;
        if (rng && from !== "range") rng.value = n;
        rebuild();
      }
      num.addEventListener("input", function () { setN(num.value, "num"); });
      if (rng) rng.addEventListener("input", function () { setN(rng.value, "range"); });
    } else {
      box.innerHTML = '<div class="row"><label>a =</label><input type="text" data-in="arr" value="' + c.def.join(", ") + '" aria-label="قيم المصفوفة"></div>' +
        (c.target !== undefined ? '<div class="row"><label>x =</label><input type="number" step="1" data-in="x" value="' + c.target + '" style="width:82px" aria-label="القيمة المطلوبة"></div>' : "") +
        '<div class="err" role="status"></div>';
      var arrIn = $('[data-in="arr"]', box), xIn = $('[data-in="x"]', box);
      err = $(".err", box);
      function setArr() {
        var parts = arrIn.value.split(/[,\s;]+/).filter(function (p) { return p !== ""; });
        if (!parts.length) { err.textContent = "المصفوفة تحتاج إلى رقم واحد على الأقل."; return; }
        if (parts.length > 8) { err.textContent = "استخدم 8 عناصر كحد أقصى ليبقى التتبّع واضحًا."; return; }
        var vals = [];
        for (var i = 0; i < parts.length; i++) {
          if (!/^-?\d+$/.test(parts[i])) { err.textContent = "أرقام صحيحة فقط، مفصولة بفواصل."; return; }
          vals.push(parseInt(parts[i], 10));
        }
        err.textContent = "";
        st.input.arr = vals;
        rebuild();
      }
      arrIn.addEventListener("input", setArr);
      if (xIn) {
        xIn.addEventListener("input", function () {
          var v = parseInt(xIn.value, 10);
          if (isNaN(v)) { err.textContent = "القيمة المطلوبة يجب أن تكون عددًا صحيحًا."; return; }
          err.textContent = "";
          st.input.x = v;
          rebuild();
        });
      }
    }
  }

  /* ---- rendering ---- */
  function frameHTML(fr) {
    var cls = { CALL: "b-call", WAITING: "b-wait", BASE: "b-base", RETURN: "b-ret" }[fr.state] || "b-wait";
    var label = { CALL: "استدعاء", WAITING: "انتظار", BASE: "حالة أساسية", RETURN: "عائد" }[fr.state] || fr.state;
    var args = Object.keys(fr.args).map(function (k) { return k + " = " + fr.args[k]; }).join(" · ");
    return '<div class="frame s-' + fr.state + '">' +
      '<div class="frame-top"><code>' + esc(fr.label) + '</code><span class="badge ' + cls + '">' + label + "</span></div>" +
      (args ? '<div class="frame-args">' + esc(args) + "</div>" : "") +
      (fr.pending ? '<div class="frame-pend">ينتظر: ' + esc(fr.pending) + "</div>" : "") +
      (fr.ret !== null && fr.ret !== undefined ? '<div class="frame-ret">أعاد ' + esc(fr.ret) + "</div>" : "") +
      "</div>";
  }

  function render() {
    var f = st.frames[st.i];
    if (!f) return;
    $$(".cl", codeEl).forEach(function (n, k) { n.classList.toggle("active", k === f.line); });

    stackEl.innerHTML = f.stack.length ? f.stack.slice().reverse().map(frameHTML).join("") : "";
    if (f.stack.length === 0) stackEl.innerHTML = '<div style="font-size:11.5px;color:#a8b2c6;padding:6px 2px">المكدّس فارغ — انتهى التنفيذ</div>';

    if (cellsEl) {
      cellsEl.innerHTML = f.arr.map(function (v, i) {
        var c = "cell" + (i === f.active ? " active" : "") + (f.match === i ? " match" : "");
        return '<div class="' + c + '"><div class="ci">' + i + '</div><div class="cv">' + v + "</div></div>";
      }).join("");
    }

    noteEl.textContent = f.note;
    outEl.textContent = f.output ? f.output + " " : "—";
    resEl.textContent = (f.result === null || f.result === undefined) ? "—" : f.result;
    countEl.textContent = "خطوة " + (st.i + 1) + " / " + st.frames.length;
    scrub.max = String(st.frames.length - 1);
    scrub.value = String(st.i);
    backBtn.disabled = st.i === 0;
    resetBtn.disabled = st.i === 0 && !st.playing;
    fwdBtn.disabled = st.i >= st.frames.length - 1;
  }

  function rebuild() {
    st.frames = sec.trace(st.input);
    st.i = 0;
    pause();
    render();
  }

  /* ---- playback ---- */
  function tick() {
    if (!st.playing) return;
    if (st.i >= st.frames.length - 1) { pause(); return; }
    st.i++; render();
    st.timer = setTimeout(tick, 1050 / st.speed);
  }
  function play() {
    if (st.playing) return;
    if (st.i >= st.frames.length - 1) { st.i = 0; render(); }
    st.playing = true;
    playBtn.textContent = "❚❚ إيقاف";
    playBtn.classList.remove("primary");
    tick();
  }
  function pause() {
    st.playing = false;
    clearTimeout(st.timer);
    playBtn.textContent = "▶ تشغيل";
    playBtn.classList.add("primary");
  }
  function stepTo(n) {
    pause();
    st.i = Math.max(0, Math.min(st.frames.length - 1, n));
    render();
  }

  playBtn.addEventListener("click", function () { st.playing ? pause() : play(); });
  backBtn.addEventListener("click", function () { stepTo(st.i - 1); });
  fwdBtn.addEventListener("click", function () { stepTo(st.i + 1); });
  resetBtn.addEventListener("click", function () { stepTo(0); });
  scrub.addEventListener("input", function () { stepTo(parseInt(scrub.value, 10)); });
  speedSel.addEventListener("change", function () {
    st.speed = parseFloat(speedSel.value) || 1;
    if (st.playing) { clearTimeout(st.timer); tick(); }
  });

  rebuild();

  return {
    play: play, pause: pause,
    reset: function () { stepTo(0); },
    step: function (d) { stepTo(st.i + d); }
  };
}

/* ============================================================
   Final assessment
   ============================================================ */
function quizHTML() {
  var body = QUIZ.map(function (q, i) {
    return '<div class="q" data-q="' + i + '">' +
      '<div class="q-head"><span class="q-num">س' + (i + 1) + '</span><span class="q-topic">' + q.topic + "</span></div>" +
      '<p class="q-text">' + q.q + "</p>" +
      '<div class="opts">' + q.options.map(function (o, j) {
        return '<button class="opt" type="button" data-i="' + j + '"><span class="key">' + LETTERS[j] + "</span><span>" + o + "</span></button>";
      }).join("") + "</div>" +
      '<div class="q-explain" hidden></div></div>';
  }).join("");

  return '<div class="view-head">' +
    '<div class="eyebrow"><span class="dot"></span>الختام</div>' +
    "<h2>التقييم النهائي</h2>" +
    '<p class="lede">اثنا عشر سؤالًا تغطي الدرسين. أجب عن جميعها ثم أرسل الإجابات لترى درجتك، وتفسيرًا لكل سؤال، والأقسام التي يُستحسن مراجعتها.</p>' +
    '<div class="meta-row"><span class="chip">12 سؤالًا</span><span class="chip">بلا حدّ زمني</span><span class="chip">أعد المحاولة كما تشاء</span></div></div>' +
    '<div class="quiz-wrap">' + body + "</div>" +
    '<div class="pager" style="border:0;padding-bottom:0"><button class="btn ghost" data-nav="prev">→ الدرس الثاني</button><span id="quizMsg" style="font-size:12.5px;color:#8b96ad;align-self:center"></span><button class="btn primary" type="button" id="submitQuiz">إرسال الإجابات</button></div>' +
    '<div id="quizResult"></div>';
}

function mountQuiz(root) {
  var answers = {};
  var wrap = root;

  $$(".q", wrap).forEach(function (qEl, qi) {
    qEl.addEventListener("click", function (e) {
      var b = e.target.closest(".opt");
      if (!b || qEl.dataset.locked === "1") return;
      answers[qi] = Number(b.dataset.i);
      $$(".opt", qEl).forEach(function (x) { x.classList.remove("sel"); });
      b.classList.add("sel");
      var msg = $("#quizMsg", wrap); if (msg) msg.textContent = "";
    });
  });

  function submit() {
    var missing = -1;
    for (var i = 0; i < QUIZ.length; i++) { if (answers[i] === undefined) { missing = i; break; } }
    var msg = $("#quizMsg", wrap);
    if (missing >= 0) {
      if (msg) msg.textContent = "أجب عن السؤال " + (missing + 1) + " أولًا.";
      var q = $$(".q", wrap)[missing];
      if (q) q.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    if (msg) msg.textContent = "";

    var score = 0, weak = {};
    $$(".q", wrap).forEach(function (qEl, qi) {
      var q = QUIZ[qi];
      var ok = answers[qi] === q.answer;
      if (ok) score++;
      else {
        if (!weak[q.section]) weak[q.section] = { topic: q.topic, count: 0 };
        weak[q.section].count++;
      }
      qEl.dataset.locked = "1";
      qEl.classList.add(ok ? "review-ok" : "review-no");
      $$(".opt", qEl).forEach(function (b, j) {
        b.classList.remove("sel");
        b.disabled = true;
        if (j === q.answer) b.classList.add("correct");
        else if (j === answers[qi]) b.classList.add("wrong");
      });
      var ex = $(".q-explain", qEl);
      ex.hidden = false;
      ex.innerHTML = "<b>" + (ok ? "إجابة صحيحة." : "الإجابة هي " + LETTERS[q.answer] + ".") + "</b> " + q.explain;
    });

    var pct = Math.round((score / QUIZ.length) * 100);
    var line = pct >= 90 ? "ممتاز — تقرأ الاستدعاء الذاتي بطلاقة."
      : pct >= 70 ? "عمل جيد. موضوع أو موضوعان يستحقّان نظرة أخرى."
      : pct >= 50 ? "أنت على الطريق — راجع الأقسام المبرزة وأعد تشغيل الحركات."
      : "ابدأ من الدرس الأول وتابع كل تتبّع ببطء.";

    var recos = Object.keys(weak).map(function (sid) {
      var v = VIEWS.filter(function (x) { return x.id === sid; })[0];
      return '<div class="reco-item"><span><b>' + weak[sid].topic + "</b> · " + weak[sid].count +
        " سؤالًا للمراجعة</span><a class=\"btn sm soft\" href=\"#" + sid + "\">" + (v ? v.nav : "مراجعة") + "</a></div>";
    }).join("");

    $("#quizResult", wrap).innerHTML =
      '<div class="score-card"><div class="big">' + score + " / " + QUIZ.length + "</div><p>" + pct + "% · " + line + "</p>" +
      '<div class="reco">' + (recos || '<div class="reco-item"><span>أُجيب عن كل المواضيع بشكل صحيح — لا شيء للمراجعة.</span></div>') + "</div></div>" +
      '<div class="pager" style="border-color:rgba(255,255,255,.18)"><button class="btn" type="button" id="retakeQuiz">↺ أعد الاختبار</button><button class="btn primary" data-nav="prev">→ راجع الدرس الثاني</button></div>';

    var retake = $("#retakeQuiz", wrap);
    if (retake) {
      retake.addEventListener("click", function () {
        wrap.innerHTML = quizHTML();
        mountQuiz(wrap);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    store.read.final = true;
    store.quiz = { score: score, total: QUIZ.length };
    persist();
    updateProgress();
    $("#quizResult", wrap).scrollIntoView({ behavior: "smooth", block: "start" });
  }

  var btn = $("#submitQuiz", wrap);
  if (btn) btn.addEventListener("click", submit);
}

/* ============================================================
   Navigation, progress, presentation mode
   ============================================================ */
function isDone(v) {
  if (v.exercises && v.exercises.length) {
    return v.exercises.every(function (e) { return !!store.solved[e.id]; });
  }
  return !!store.read[v.id];
}

function updateProgress() {
  var total = VIEWS.length, done = VIEWS.filter(isDone).length;
  var pct = total ? Math.round((done / total) * 100) : 0;
  ["#sideBar", "#topBar"].forEach(function (s) {
    var el = $(s); if (el) el.style.width = pct + "%";
  });
  var sp = $("#sidePct"), tp = $("#topPct");
  if (sp) sp.textContent = pct + "%";
  if (tp) tp.textContent = pct + "%";
  var sn = $("#sideNote");
  if (sn) sn.textContent = done + " من " + total + " أقسام مكتملة";
  $$("#nav a").forEach(function (a) {
    var v = VIEWS.filter(function (x) { return x.id === a.dataset.id; })[0];
    if (v) a.classList.toggle("done", isDone(v));
  });
}

function buildNav() {
  var nav = $("#nav"), html = "";
  GROUPS.forEach(function (g) {
    var items = VIEWS.filter(function (v) { return v.group === g.id; });
    if (!items.length) return;
    html += '<div class="nav-group">' + g.label + "</div>";
    items.forEach(function (v) {
      html += '<a href="#' + v.id + '" data-id="' + v.id + '">' + tickSVG() + "<span>" + v.nav + "</span></a>";
    });
  });
  nav.innerHTML = html;
}

function show(id) {
  var found = VIEWS.filter(function (v) { return v.id === id; })[0];
  if (!found) found = VIEWS[0];
  VIEWS.forEach(function (v) {
    var el = document.getElementById("v-" + v.id);
    if (el) el.hidden = v.id !== found.id;
  });
  $$("#nav a").forEach(function (a) { a.classList.toggle("active", a.dataset.id === found.id); });
  current = found.id;
  closeMenu();
  window.scrollTo(0, 0);
}

var HASH_OK = window.location.protocol !== "about:";
function navTo(id) {
  if (!VIEWS.some(function (v) { return v.id === id; })) return;
  if (HASH_OK) {
    try { if (window.location.hash !== "#" + id) window.location.hash = id; } catch (e) {}
  }
  show(id);
}

function gotoRel(dir) {
  var i = VIEWS.map(function (v) { return v.id; }).indexOf(current);
  var j = dir === "next" ? i + 1 : i - 1;
  if (j >= 0 && j < VIEWS.length) navTo(VIEWS[j].id);
}

function setPresent(on) {
  var should = typeof on === "boolean" ? on : !document.body.classList.contains("present");
  document.body.classList.toggle("present", should);
  if (!should && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
}

function revealCurrent() {
  var sec = document.getElementById("v-" + current);
  if (!sec) return;
  $$(".ex", sec).forEach(function (ex) {
    var b = $('[data-a="solution"]', ex);
    if (b) b.click();
  });
}

function closeMenu() {
  var sb = $("#sidebar"), sc = $("#scrim");
  if (sb) sb.classList.remove("open");
  if (sc) sc.classList.remove("show");
}

/* ---------------- wiring ---------------- */
$("#menuBtn").addEventListener("click", function () {
  var sb = $("#sidebar"), sc = $("#scrim");
  var open = !sb.classList.contains("open");
  sb.classList.toggle("open", open);
  sc.classList.toggle("show", open);
});
$("#scrim").addEventListener("click", closeMenu);

document.addEventListener("click", function (e) {
  var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
  if (!a) return;
  e.preventDefault();
  navTo(a.getAttribute("href").slice(1));
});
$("#presentBtn").addEventListener("click", function () { setPresent(); });

$("#content").addEventListener("click", function (e) {
  var navBtn = e.target.closest("[data-nav]");
  if (navBtn && !navBtn.disabled) { gotoRel(navBtn.dataset.nav); return; }
  var pt = e.target.closest("[data-present-toggle]");
  if (pt) setPresent(true);
});

$("#presentBar").addEventListener("click", function (e) {
  var b = e.target.closest("[data-p]");
  if (!b) return;
  var act = b.dataset.p;
  var viz = VIZ[current];
  if (act === "prev") gotoRel("prev");
  else if (act === "next") gotoRel("next");
  else if (act === "play" && viz) viz.play();
  else if (act === "pause" && viz) viz.pause();
  else if (act === "reset" && viz) viz.reset();
  else if (act === "step" && viz) viz.step(1);
  else if (act === "reveal") revealCurrent();
  else if (act === "full") {
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
    } else if (document.exitFullscreen) document.exitFullscreen();
  } else if (act === "exit") setPresent(false);
});

window.addEventListener("hashchange", function () { show(window.location.hash.replace("#", "")); });

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { setPresent(false); return; }
  if (!document.body.classList.contains("present")) return;
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  var v = VIZ[current];
  if (!v) return;
  if (e.key === "ArrowLeft") { v.step(1); e.preventDefault(); }
  else if (e.key === "ArrowRight") { v.step(-1); e.preventDefault(); }
});

/* ---------------- boot ---------------- */
(function boot() {
  var content = $("#content");
  VIEWS.forEach(function (v) {
    var s = document.createElement("section");
    s.className = "view";
    s.id = "v-" + v.id;
    s.hidden = true;
    s.innerHTML = v.html();
    content.appendChild(s);
    if (v.mount) v.mount(s);
  });
  buildNav();
  updateProgress();
  show(window.location.hash.replace("#", "") || VIEWS[0].id);
})();
</script>
